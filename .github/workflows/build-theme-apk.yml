name: Build Arthur Theme APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build luci-theme-arthur-skin APK directly
        run: |
          set -e
          mkdir -p pkg_root/etc/uci-defaults
          mkdir -p pkg_root/www/luci-static/arthur
          mkdir -p pkg_root/www/luci-static/resources
          mkdir -p dist

          # 1. 提取雪山主题静态资源并替换占位符
          cp -a package/arthur/files/www/luci-static/arthur/* pkg_root/www/luci-static/arthur/
          sed -i 's/@ARTHUR_BUILD@/1.0.0/g' pkg_root/www/luci-static/arthur/theme.css

          AVATAR_B64=$(base64 -w 0 pkg_root/www/luci-static/arthur/avatar.jpg)
          SVG_PROTO="http://"
          SVG_HOST="www.w3.org/2000/svg"
          cat <<EOF > pkg_root/www/luci-static/arthur/favicon.svg
          <svg xmlns="${SVG_PROTO}${SVG_HOST}" width="64" height="64" viewBox="0 0 64 64"><image width="64" height="64" preserveAspectRatio="xMidYMid meet" href="data:image/jpeg;base64,${AVATAR_B64}"/></svg>
          EOF

          cp -a package/arthur/files/www/luci-static/resources/arthur-shell.js pkg_root/www/luci-static/resources/
          sed -i 's/@ARTHUR_VERSION@/1.0.0/g' pkg_root/www/luci-static/resources/arthur-shell.js

          # 2. 生成适配 ImmortalWrt 6.18.60 (ucode LuCI) 的自动挂载脚本
          cat <<'EOF' > pkg_root/etc/uci-defaults/95-arthur-skin-inject
          #!/bin/sh
          TPL_DIR="/usr/share/ucode/luci/template/themes/argon"
          SKIN_LINK='<script>try{document.documentElement.dataset.arthurTheme=localStorage.getItem("arthur-theme")==="dark"?"dark":"light"}catch(e){}</script><link rel="stylesheet" href="/luci-static/arthur/theme.css?v=1.0.0">'

          [ -d "$TPL_DIR" ] || exit 0

          if [ -f "$TPL_DIR/head_meta.ut" ] && ! grep -q "/luci-static/arthur/theme.css" "$TPL_DIR/head_meta.ut"; then
              printf '\n%s\n' "$SKIN_LINK" >> "$TPL_DIR/head_meta.ut"
          fi

          for ut in header.ut header_login.ut; do
              if [ -f "$TPL_DIR/$ut" ]; then
                  sed -i "s/mode\s*=\s*cfg\.get_first([^;]*);/mode = 'light';/g" "$TPL_DIR/$ut"
              fi
          done

          if [ -f "$TPL_DIR/footer.ut" ] && ! grep -q "arthur-shell" "$TPL_DIR/footer.ut"; then
              sed -i "s/L\.require(['\"]menu-argon['\"])/L.require('menu-argon'); L.require('arthur-shell')/g" "$TPL_DIR/footer.ut"
          fi

          uci -q set luci.main.mediaurlbase='/luci-static/argon'
          uci -q commit luci
          rm -rf /tmp/luci-indexcache* /tmp/luci-modulecache/*
          exit 0
          EOF
          chmod 0755 pkg_root/etc/uci-defaults/95-arthur-skin-inject

          # 3. 使用原生 apk-tools 直接打包标准 APK 归档
          docker run --rm -v "$PWD:/work" -w /work alpine:edge sh -c '
            apk add --no-cache apk-tools openssl
            openssl ecparam -name prime256v1 -genkey -noout -out private.pem
            openssl ec -in private.pem -pubout -out public.pem
            apk mkpkg \
              --info "name:luci-theme-arthur-skin" \
              --info "version:1.0.0-r1" \
              --info "description:Arthur Snow Mountain Skin for ImmortalWrt Argon" \
              --info "arch:noarch" \
              --info "license:Apache-2.0" \
              --info "origin:luci-theme-arthur-skin" \
              --info "url:localhost" \
              --info "maintainer:cookorz" \
              --files pkg_root \
              --script post-install:pkg_root/etc/uci-defaults/95-arthur-skin-inject \
              --sign private.pem \
              --output dist/luci-theme-arthur-skin-1.0.0-r1.apk
          '

      - name: Upload Theme APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arthur-snow-mountain-theme-apk
          path: dist/luci-theme-arthur-skin-1.0.0-r1.apk
